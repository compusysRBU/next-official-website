name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # ---- NEW: Clean Next.js cache to avoid stale lint paths ----
      - name: Clean Next cache
        run: rm -rf .next

      - name: Run Prettier
        run: bun run format

      # ---- NEW: Disable Next lint cache to prevent /lint ghost bug ----
      - name: Run ESLint
        run: NEXT_DISABLE_LINT_CACHE=1 bun run lint

      - name: Check Prettier formatting
        run: bun run format:check

      - name: Type check
        run: bun run type-check

      - name: Build project
        run: bun run build

      - name: Run tests
        run: bun run test
        continue-on-error: true
